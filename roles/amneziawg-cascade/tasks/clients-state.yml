---
- name: Select effective inventory peers
  ansible.builtin.set_fact:
    awg_dynamic_clients: '{{ awg_effective_clients.dynamic }}'
    awg_removed_clients: '{{ awg_effective_clients.removed }}'
    awg_inventory_clients: '{{ awg_effective_clients.inventory }}'
- name: Read private keys of dynamically created clients
  ansible.builtin.slurp:
    src: '/etc/amnezia/amneziawg/cascade-keys/client-{{ item.name }}.key'
  loop: '{{ awg_dynamic_clients }}'
  register: awg_dynamic_keys
  no_log: true
- name: Check dynamic key pairs
  ansible.builtin.command:
    argv: [awg, pubkey]
    stdin: '{{ item.content | b64decode | trim }}'
  loop: '{{ awg_dynamic_keys.results }}'
  register: awg_dynamic_public
  changed_when: false
  failed_when: awg_dynamic_public.stdout | trim != item.item.public_key
  no_log: true
- name: Index dynamic keys for client profile refresh
  ansible.builtin.set_fact:
    awg_private_keys: "{{ awg_private_keys | combine({'client-' + item.item.name: item.content | b64decode | trim}) }}"
  loop: '{{ awg_dynamic_keys.results }}'
  no_log: true
- name: Save settings used by client management scripts
  ansible.builtin.copy:
    content: "{{ awg_topology | awg_cascade_settings(awg_client_interface, hostvars[awg_gate].ansible_host, awg_dns) | to_nice_json }}"
    dest: /etc/amnezia/amneziawg/cascade-settings.json
    mode: '0600'
- name: Save client to routing table bindings
  ansible.builtin.copy:
    content: "{{ awg_effective_clients | awg_cascade_bindings(awg_topology) }}"
    dest: /etc/amnezia/amneziawg/cascade-bindings.list
    mode: '0600'
