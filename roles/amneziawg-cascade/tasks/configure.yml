---
- name: Install per-client routing rule synchronizer before any settings that need it
  ansible.builtin.copy:
    src: cascade_rules.py
    dest: /usr/local/sbin/awg-cascade-rules
    mode: '0700'
    validate: python3 -m py_compile %s
  when: awg_node_role == 'gate'
- name: Validate declared link public keys on gate
  ansible.builtin.assert:
    that:
      - awg_public_keys['link'] == awg_gate_link_public_key
      - awg_topology | awg_cascade_check_link_keys(awg_gate_link_public_key)
    fail_msg: Run all nodes with --tags prepare, copy their public link keys into inventory (hub keys into each hub's host vars), then run hub.yml and gate.yml separately.
  when: awg_node_role == 'gate'
- name: Validate declared link public keys on hub
  ansible.builtin.assert:
    that:
      - awg_gate_link_public_key is match('^[A-Za-z0-9+/]{43}=$')
      - awg_hub_link_public_key is match('^[A-Za-z0-9+/]{43}=$')
      - awg_public_keys['link'] == awg_hub_link_public_key
    fail_msg: Run all nodes with --tags prepare, copy their public link keys into inventory (hub keys into each hub's host vars), then run hub.yml and gate.yml separately.
  when: awg_node_role == 'hub'
- name: Select managed interfaces and links
  ansible.builtin.set_fact:
    awg_interfaces: "{{ awg_topology.gate_interfaces if awg_node_role == 'gate' else [awg_hub_interface] }}"
    awg_links: "{{ awg_topology | awg_cascade_links(awg_node_role, inventory_hostname, awg_hub_interface) }}"
- name: Check previous interface ownership record
  ansible.builtin.stat:
    path: /var/lib/awg-cascade/interfaces.json
  register: awg_interface_record
- name: Read previous interface names
  ansible.builtin.slurp:
    src: /var/lib/awg-cascade/interfaces.json
  when: awg_interface_record.stat.exists
  register: awg_previous_interfaces
- name: Refuse implicit interface renaming or removal
  ansible.builtin.assert:
    that:
      - awg_previous_interfaces.content | b64decode | from_json | awg_cascade_check_interfaces(awg_interfaces)
    fail_msg: Interface names changed. Stop and disable previous interfaces before migrating; see README. Old services must not be left enabled.
  when: awg_interface_record.stat.exists
- name: Check interface config ownership
  ansible.builtin.stat:
    path: '/etc/amnezia/amneziawg/{{ item }}.conf'
  loop: '{{ awg_interfaces }}'
  register: awg_existing
- name: Refuse to replace unmanaged interfaces
  ansible.builtin.command:
    argv: [grep, -Fxq, '# Managed by amneziawg-cascade. Clients are managed in inventory.', '/etc/amnezia/amneziawg/{{ item.item }}.conf']
  loop: '{{ awg_existing.results }}'
  when: item.stat.exists
  changed_when: false
- name: Create systemd-networkd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/networkd.conf.d
    state: directory
    mode: '0755'
# A networkd restart (e.g. by needrestart after unattended-upgrades) would
# otherwise delete the hooks' ip rules and table routes and drop client traffic.
# Read on the next networkd start; never restart networkd here, that would
# remove the rules on its own.
- name: Keep systemd-networkd from removing cascade ip rules and routes
  ansible.builtin.copy:
    content: |
      # Managed by amneziawg-cascade.
      [Network]
      ManageForeignRoutingPolicyRules=no
      ManageForeignRoutes=no
    dest: /etc/systemd/networkd.conf.d/10-awg-cascade.conf
    mode: '0644'
- name: Load script-managed clients before rendering entry configuration
  ansible.builtin.include_tasks: clients-state.yml
  when: awg_node_role == 'gate'
- name: Preview config updates without logging keys
  ansible.builtin.template:
    src: server.conf.j2
    dest: '/etc/amnezia/amneziawg/{{ item }}.conf'
    mode: '0600'
    backup: true
  loop: '{{ awg_interfaces }}'
  check_mode: true
  register: awg_config_preview
  no_log: true
  diff: false
- name: Preview routing hook updates
  ansible.builtin.template:
    src: hooks.sh.j2
    dest: '/usr/local/sbin/awg-cascade-{{ item }}'
    mode: '0700'
  loop: '{{ awg_interfaces }}'
  check_mode: true
  register: awg_hooks_preview
- name: Start list of interfaces whose config or hook changes
  ansible.builtin.set_fact:
    awg_changed_interfaces: []
- name: Select interfaces whose config or hook changes
  ansible.builtin.set_fact:
    awg_changed_interfaces: "{{ awg_changed_interfaces + [item] if (awg_config_preview.results[idx].changed or awg_hooks_preview.results[idx].changed) else awg_changed_interfaces }}"
  loop: '{{ awg_interfaces }}'
  loop_control:
    index_var: idx
- name: Stop only interfaces whose config or hook changes
  ansible.builtin.systemd_service:
    name: 'awg-quick@{{ item.item }}'
    state: stopped
  loop: '{{ awg_existing.results | reverse | list }}'
  when: item.stat.exists and item.item in awg_changed_interfaces
- name: Install routing hooks
  ansible.builtin.template:
    src: hooks.sh.j2
    dest: '/usr/local/sbin/awg-cascade-{{ item }}'
    mode: '0700'
    validate: bash -n %s
    backup: true
  loop: '{{ awg_interfaces }}'
- name: Install server configs
  ansible.builtin.template:
    src: server.conf.j2
    dest: '/etc/amnezia/amneziawg/{{ item }}.conf'
    mode: '0600'
    backup: true
  loop: '{{ awg_interfaces }}'
  no_log: true
  diff: false
- name: Install RU prefix updater
  ansible.builtin.template:
    src: update-ru-routes.sh.j2
    dest: /usr/local/sbin/awg-cascade-ru-routes
    mode: '0700'
    validate: bash -n %s
  when: awg_node_role == 'gate'
- name: Install manual RU prefix exceptions
  ansible.builtin.copy:
    content: "{{ awg_ru_extra | join('\n') }}\n"
    dest: /etc/amnezia/amneziawg/cascade-ru-extra.list
    mode: '0644'
  when: awg_node_role == 'gate'
  register: awg_extra_change
- name: Install RU refresh units
  ansible.builtin.template:
    src: 'ru-refresh.{{ item }}.j2'
    dest: '/etc/systemd/system/awg-cascade-ru.{{ item }}'
    mode: '0644'
  loop: [service, timer]
  when: awg_node_role == 'gate'
- name: Download initial RU prefixes or refresh changed exceptions
  ansible.builtin.command: /usr/local/sbin/awg-cascade-ru-routes --refresh
  args:
    creates: "{{ omit if awg_extra_change.changed else '/var/lib/awg-cascade/awg_cascade_split.nft' }}"
  when: awg_node_role == 'gate' and awg_ru_split
- name: Enable or stop RU prefix timer
  ansible.builtin.systemd_service:
    name: awg-cascade-ru.timer
    enabled: '{{ awg_ru_split | bool }}'
    state: "{{ 'started' if awg_ru_split else 'stopped' }}"
    daemon_reload: true
  when: awg_node_role == 'gate'
- name: Remove RU marking when disabled
  ansible.builtin.command: nft delete table inet awg_cascade_split
  register: awg_remove_marking
  failed_when: awg_remove_marking.rc not in [0, 1]
  changed_when: awg_remove_marking.rc == 0
  when: awg_node_role == 'gate' and not awg_ru_split
- name: Generate client profiles on gate only
  ansible.builtin.template:
    src: client.conf.j2
    dest: '/etc/amnezia/amneziawg/cascade-clients/{{ item.name }}.conf'
    mode: '0600'
  loop: '{{ awg_effective_clients.inventory + awg_effective_clients.dynamic }}'
  when: awg_node_role == 'gate'
  no_log: true
  diff: false
- name: Start links before client entry and enable autostart
  ansible.builtin.systemd_service:
    name: 'awg-quick@{{ item }}'
    state: started
    enabled: true
  loop: '{{ awg_interfaces }}'
- name: Synchronize per-client routing rules with the bindings file
  ansible.builtin.command: /usr/local/sbin/awg-cascade-rules
  register: awg_sync
  changed_when: awg_sync.stdout | trim != 'added=0 removed=0'
  when: awg_node_role == 'gate'
- name: Verify configured listening ports
  ansible.builtin.command: 'awg show {{ item }} listen-port'
  loop: '{{ awg_interfaces }}'
  register: awg_listen
  changed_when: false
  vars:
    awg_expected_port: "{{ awg_client_port | int if (awg_node_role == 'gate' and item == awg_client_interface) else (awg_links[item].gate_port if awg_node_role == 'gate' else awg_links[item].hub_port) }}"
  failed_when: awg_listen.stdout | int != awg_expected_port | int
- name: Record managed interface names
  ansible.builtin.copy:
    content: '{{ awg_interfaces | to_json }}'
    dest: /var/lib/awg-cascade/interfaces.json
    mode: '0600'
