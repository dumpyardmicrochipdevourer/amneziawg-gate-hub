---
- name: Validate platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version in ['22.04', '24.04']
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.virtualization_type not in ['lxc', 'openvz', 'docker', 'container']
- name: Start gate and hub input lists
  ansible.builtin.set_fact:
    awg_gate_inputs: []
    awg_hub_inputs: []
- name: Collect gate inputs
  ansible.builtin.set_fact:
    awg_gate_inputs: "{{ awg_gate_inputs + [{'name': item, 'host': hostvars[item].ansible_host}] }}"
  loop: "{{ groups.get('awg_gate', []) }}"
- name: Collect hub inputs
  ansible.builtin.set_fact:
    awg_hub_inputs: "{{ awg_hub_inputs + [{'name': item, 'host': hostvars[item].ansible_host, 'index': hostvars[item].awg_hub_index | default(none), 'public_key': hostvars[item].awg_hub_link_public_key | default(''), 'hub_port': hostvars[item].awg_hub_port | default(awg_hub_port)}] }}"
  loop: "{{ groups.get('awg_hub', []) }}"
- name: Collect topology settings
  ansible.builtin.set_fact:
    awg_topology_settings:
      gates: '{{ awg_gate_inputs }}'
      client_interface: '{{ awg_client_interface }}'
      client_port: '{{ awg_client_port }}'
      client_subnet: '{{ awg_client_subnet }}'
      link_interface: '{{ awg_gate_link_interface }}'
      link_port: '{{ awg_gate_link_port }}'
      link_subnet: '{{ awg_link_subnet }}'
      hub_interface: '{{ awg_hub_interface }}'
      route_table: '{{ awg_route_table }}'
      ru_table: '{{ awg_ru_table }}'
      default_hub: "{{ awg_default_hub | default('') }}"
- name: Validate topology of gate and hubs
  ansible.builtin.set_fact:
    awg_topology: "{{ awg_hub_inputs | awg_cascade_topology(awg_topology_settings) }}"
- name: Validate inventory clients
  ansible.builtin.set_fact:
    awg_checked_clients: "{{ awg_clients | awg_cascade_check_clients(awg_topology) }}"
- name: Select outbound interface and node names
  ansible.builtin.set_fact:
    awg_wan: '{{ awg_egress_interface | default(ansible_facts.default_ipv4.interface) }}'
    awg_gateway: '{{ awg_egress_gateway | default(ansible_facts.default_ipv4.gateway) }}'
    awg_gate: "{{ groups['awg_gate'][0] }}"
- name: Validate network arguments
  ansible.builtin.assert:
    that:
      - awg_wan is match('^[A-Za-z0-9_.:-]{1,15}$')
      - awg_wan not in awg_topology.gate_interfaces + [awg_hub_interface]
      - awg_gateway is match('^[0-9.]+$')
- name: Check persistent client registry
  ansible.builtin.stat:
    path: /etc/amnezia/amneziawg/cascade-clients.json
  register: awg_registry_file
  when: awg_node_role == 'gate'
- name: Read persistent client registry
  ansible.builtin.slurp:
    src: /etc/amnezia/amneziawg/cascade-clients.json
  when: awg_node_role == 'gate' and awg_registry_file.stat.exists
  register: awg_registry_raw
- name: Validate effective clients including the script-created registry
  ansible.builtin.set_fact:
    awg_effective_clients: "{{ awg_clients | awg_cascade_effective_clients((awg_registry_raw.content | b64decode | from_json) if awg_registry_file.stat.exists else none, awg_topology) }}"
  when: awg_node_role == 'gate'
- name: Install kernel build prerequisites
  ansible.builtin.apt:
    name:
      - software-properties-common
      - python3-launchpadlib
      - gnupg
      - build-essential
      - dkms
      - "linux-headers-{{ ansible_facts.kernel }}"
      - iptables
    update_cache: true
    cache_valid_time: 3600

- name: Enable Ubuntu sources for DKMS kernel source lookup
  ansible.builtin.apt_repository:
    repo: "deb-src http://archive.ubuntu.com/ubuntu {{ ansible_facts.distribution_release }}{{ item }} main restricted universe multiverse"
    filename: awg-cascade-sources
    state: present
  loop: ['', '-updates', '-security']

- name: Add official Amnezia PPA
  ansible.builtin.apt_repository:
    repo: ppa:amnezia/ppa
    state: present

- name: Install AWG module and tools (requires a real run)
  when: not ansible_check_mode
  block:
    - name: Install AmneziaWG kernel module and tools
      ansible.builtin.apt:
        name: [amneziawg, amneziawg-tools]
        state: present
        update_cache: true

    - name: Load module and fail early if DKMS or Secure Boot prevents loading
      ansible.builtin.command: modprobe amneziawg
      changed_when: false


    - name: Install routing prerequisites
      ansible.builtin.apt:
        name: [curl, python3, nftables, iproute2]
        state: present
    - name: Create private directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - /etc/amnezia/amneziawg
        - /etc/amnezia/amneziawg/cascade-keys
        - /etc/amnezia/amneziawg/cascade-clients
        - /var/lib/awg-cascade
    - name: Generate persistent node and client keys
      ansible.builtin.shell: |
        set -eu
        umask 077
        awg genkey > {{ ('/etc/amnezia/amneziawg/cascade-keys/' + item + '.key') | quote }}
      args:
        creates: '/etc/amnezia/amneziawg/cascade-keys/{{ item }}.key'
      loop: "{{ ['link'] + (['entry'] + (awg_clients | map(attribute='name') | map('regex_replace', '^', 'client-') | list) if inventory_hostname in groups['awg_gate'] else []) }}"
      no_log: true
    - name: Read persistent keys
      ansible.builtin.slurp:
        src: '/etc/amnezia/amneziawg/cascade-keys/{{ item }}.key'
      loop: "{{ ['link'] + (['entry'] + (awg_clients | map(attribute='name') | map('regex_replace', '^', 'client-') | list) if inventory_hostname in groups['awg_gate'] else []) }}"
      register: awg_keys_raw
      no_log: true
    - name: Derive public keys
      ansible.builtin.command:
        argv: [awg, pubkey]
        stdin: '{{ item.content | b64decode | trim }}'
      loop: '{{ awg_keys_raw.results }}'
      register: awg_public_raw
      changed_when: false
      no_log: true
    - name: Index keys for rendering
      ansible.builtin.set_fact:
        awg_private_keys: "{{ awg_private_keys | default({}) | combine({item.item: item.content | b64decode | trim}) }}"
        awg_public_keys: "{{ awg_public_keys | default({}) | combine({item.item: awg_public_raw.results[idx].stdout | trim}) }}"
      loop: '{{ awg_keys_raw.results }}'
      loop_control:
        index_var: idx
      no_log: true
    - name: Enable persistent forwarding
      ansible.builtin.copy:
        content: "net.ipv4.ip_forward = 1\n"
        dest: /etc/sysctl.d/91-awg-cascade.conf
        mode: '0644'
    - name: Read forwarding state
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: awg_forwarding
      changed_when: false
    - name: Apply forwarding
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      when: awg_forwarding.stdout | trim != '1'
